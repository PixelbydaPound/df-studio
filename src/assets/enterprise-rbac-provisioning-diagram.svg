<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" fill="none" role="img" aria-label="Concept flow from group provisioning to universal identity licensing and RBAC">
  <rect width="960" height="360" rx="16" fill="#0f172a"/>
  <text x="480" y="32" fill="#ffffff99" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" letter-spacing="0.1em">GROUP PROVISIONING TO IDENTITY TO RBAC (CONCEPT)</text>
  <g font-family="system-ui,sans-serif">
    <rect x="24" y="72" width="160" height="88" rx="10" fill="#1e293b" stroke="#ffffff18"/>
    <text x="104" y="108" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Groups</text>
    <text x="104" y="130" fill="#ffffff77" font-size="10" text-anchor="middle">Teams and regions</text>
    <path d="M184 116 H224" stroke="#EB5097" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="224" y="72" width="160" height="88" rx="10" fill="#EB509715" stroke="#EB5097"/>
    <text x="304" y="104" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Universal</text>
    <text x="304" y="122" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">identity</text>
    <text x="304" y="142" fill="#ffffff77" font-size="10" text-anchor="middle">One user, one login</text>
    <path d="M384 116 H424" stroke="#EB5097" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="424" y="72" width="160" height="88" rx="10" fill="#1e293b" stroke="#ffffff18"/>
    <text x="504" y="108" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Licensing</text>
    <text x="504" y="130" fill="#ffffff77" font-size="10" text-anchor="middle">Billable vs staff</text>
    <path d="M584 116 H624" stroke="#EB5097" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="624" y="72" width="160" height="88" rx="10" fill="#1e293b" stroke="#ffffff18"/>
    <text x="704" y="108" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">RBAC roles</text>
    <text x="704" y="130" fill="#ffffff77" font-size="10" text-anchor="middle">Templates, read-only</text>
    <path d="M784 116 H824" stroke="#EB5097" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="776" y="72" width="160" height="88" rx="10" fill="#1e293b" stroke="#ffffff18"/>
    <text x="856" y="104" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Area</text>
    <text x="856" y="122" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">permissions</text>
    <text x="856" y="142" fill="#ffffff77" font-size="10" text-anchor="middle">Matrix enforcement</text>
  </g>
  <rect x="48" y="200" width="864" height="120" rx="12" fill="#111827" stroke="#ffffff12"/>
  <text x="72" y="232" fill="#EB5097" font-size="12" font-weight="600">Research and validation loop</text>
  <text x="72" y="258" fill="#ffffff88" font-size="11">Weekly enterprise design-partner sessions, PoC walkthroughs, assumption checks</text>
  <text x="72" y="280" fill="#ffffff88" font-size="11">Findings logged in automated UX research repository, triangulated with architecture and PM</text>
  <text x="72" y="302" fill="#ffffff55" font-size="10">Anonymized portfolio diagram - not proprietary product UI</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#EB5097"/>
    </marker>
  </defs>
</svg>
