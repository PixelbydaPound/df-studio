<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none" role="img" aria-label="Concept diagram of MSO admin layer across a multi-application ecosystem">
  <rect width="960" height="520" rx="16" fill="#0f172a"/>
  <text x="480" y="36" fill="#ffffff99" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" letter-spacing="0.12em">MSO / ENTERPRISE LAYER (CONCEPT)</text>
  <rect x="280" y="56" width="400" height="72" rx="12" fill="#EB509722" stroke="#EB5097" stroke-width="1.5"/>
  <text x="480" y="88" fill="#ffffff" font-family="system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="middle">Single org-admin entry</text>
  <text x="480" y="110" fill="#ffffff88" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Roles, permissions, licensing visibility</text>
  <line x1="480" y1="128" x2="480" y2="152" stroke="#ffffff33" stroke-width="2"/>
  <rect x="120" y="152" width="720" height="88" rx="12" fill="#111827" stroke="#ffffff18"/>
  <text x="480" y="182" fill="#EB5097" font-family="system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Unified authorization and permission matrix</text>
  <text x="480" y="204" fill="#ffffff77" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Read / write / deny by area, audit, templates</text>
  <text x="480" y="224" fill="#ffffff55" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">Portfolio concept - not a client screenshot</text>
  <line x1="200" y1="240" x2="200" y2="268" stroke="#ffffff25"/>
  <line x1="480" y1="240" x2="480" y2="268" stroke="#ffffff25"/>
  <line x1="760" y1="240" x2="760" y2="268" stroke="#ffffff25"/>
  <rect x="48" y="268" width="200" height="100" rx="10" fill="#1e293b" stroke="#ffffff15"/>
  <rect x="264" y="268" width="200" height="100" rx="10" fill="#1e293b" stroke="#ffffff15"/>
  <rect x="480" y="268" width="200" height="100" rx="10" fill="#1e293b" stroke="#ffffff15"/>
  <rect x="696" y="268" width="216" height="100" rx="10" fill="#1e293b" stroke="#ffffff15"/>
  <text x="148" y="308" fill="#ffffff" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle">Clinical app</text>
  <text x="148" y="328" fill="#ffffff66" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Legacy access</text>
  <text x="364" y="308" fill="#ffffff" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle">Revenue app</text>
  <text x="364" y="328" fill="#ffffff66" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Legacy access</text>
  <text x="580" y="308" fill="#ffffff" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle">Engagement app</text>
  <text x="580" y="328" fill="#ffffff66" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Legacy access</text>
  <text x="804" y="308" fill="#ffffff" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle">More surfaces</text>
  <text x="804" y="328" fill="#ffffff66" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Same identity story</text>
  <rect x="120" y="400" width="720" height="88" rx="12" fill="#0a0a0a" stroke="#ffffff10" stroke-dasharray="6 4"/>
  <text x="480" y="432" fill="#ffffffaa" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Enterprise customer org (MSO / multi-location practice)</text>
  <text x="480" y="456" fill="#ffffff55" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Design goal: one place to govern effective access across the ecosystem</text>
</svg>
